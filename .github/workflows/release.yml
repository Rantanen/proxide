name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
    branches:
      - 'release-test-[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:

  # This job is responsible for creating the (draft) release _once_ for each tag.
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      real_release: ${{ steps.version.outputs.real_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get release version
        id: version
        run: |
          echo "Ref: $GITHUB_REF"
          ref_no_tag=${GITHUB_REF#refs/tags/}
          proxide_version=${ref_no_tag#refs/heads/release-test-}
          echo "Version: ${proxide_version}"
          echo "version=${proxide_version}" >> $GITHUB_OUTPUT

          if [[ $GITHUB_REF == *"release-test"* ]]; then
            # Test releases stay as drafts; a draft release does not create the tag.
            echo "Release test"
            echo "tag=test-${proxide_version}" >> $GITHUB_OUTPUT
            echo "real_release=false" >> $GITHUB_OUTPUT
          else
            echo "Normal release"
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "real_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Version check
        run: |
          toml_version="$(head Cargo.toml | grep "^version" | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$toml_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "Version mismatch!"
            echo "Tag:   ${{ steps.version.outputs.version }}"
            echo "Crate: $toml_version"
            exit 1
          else
            echo "TOML and Git versions match"
          fi

      - name: Create GitHub release
        run: |
          cat > notes.md <<'EOF'
          See the [commit log](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.sha }}) for recent changes.

          The Windows build requires the [Microsoft Visual C++ Redistributable](https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist) (x64).
          EOF
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file notes.md

  # This job builds each release and uploads the artifacts to the release
  # created during the create-release job.
  build-release:
    name: Build release (${{ matrix.target }})
    needs: ['create-release']
    env:
      RUST_BACKTRACE: 1
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: proxide
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: proxide.exe
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Environment
        run: |
          cargo --version
          rustc --version

      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Gather artifacts
        shell: bash
        run: |
          name="proxide-${{ needs.create-release.outputs.version }}-${{ matrix.target }}"

          mkdir -p "$name"
          cp {README.md,LICENSE-MIT,LICENSE-APACHE} "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$name"

          if [ "$RUNNER_OS" == "Windows" ]; then
            asset="$name.zip"
            7z a "$asset" "$name"
          else
            asset="$name.tar.gz"
            tar czf "$asset" "$name"
          fi
          sha256sum "$asset" > "$asset.sha256"

          echo "ASSET=$asset" >> $GITHUB_ENV

      - name: Upload release assets
        shell: bash
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "$ASSET" "$ASSET.sha256" --clobber

  publish-release:
    name: Publish release
    needs: ['create-release', 'build-release']
    if: needs.create-release.outputs.real_release == 'true'
    env:
      RUST_BACKTRACE: 1
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish GitHub release
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false

      - name: Publish to crates.io
        run: |
          cargo publish --token "${{ secrets.crates_io }}"
